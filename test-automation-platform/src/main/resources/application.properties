spring.application.name=test-automation-platform

# DATABASE - MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/test_automation_platform?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SERVER
server.port=8080

# JWT
security.jwt.issuer=${JWT_ISSUER:http://localhost:8080}
security.jwt.audience=${JWT_AUDIENCE:test-automation-api}
security.jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY:PT30M}
security.jwt.key-directory=${JWT_KEY_DIRECTORY:.jwt}

# Premier compte administrateur (variables d'environnement optionnelles)
security.bootstrap-admin.email=${ADMIN_EMAIL:}
security.bootstrap-admin.password=${ADMIN_PASSWORD:}
security.bootstrap-admin.name=${ADMIN_NAME:Administrateur}

# Dossier utilisé pour stocker les projets importés (ZIP et dossiers extraits)
upload.directory=uploads

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

sonar.host.url=http://localhost:9000
sonar.login=${SONAR_TOKEN:}
