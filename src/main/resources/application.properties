spring.application.name=test-automation-platform

# DATABASE - MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/test_automation_platform?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SERVER
server.port=8080

# Dossier utilisé pour stocker les projets importés (ZIP et dossiers extraits)
upload.directory=uploads

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB
